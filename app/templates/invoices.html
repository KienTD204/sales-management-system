{% extends 'base.html' %}{% set script = 'invoices' %}
{% block content %}<div class="page-heading"><div><h1>Hóa đơn</h1><p>Tra cứu và in lại hóa đơn bán lẻ đã phát sinh.</p></div></div><section class="surface"><div class="toolbar"><h2>Danh sách hóa đơn</h2><small id="totalLabel"></small></div><form class="filters" id="filterForm"><div class="row g-2 align-items-end"><div class="col-sm-5"><label for="q" class="form-label">Tìm hóa đơn</label><input class="form-control" id="q" name="q" maxlength="120" placeholder="Mã hóa đơn, mã đơn hoặc tên khách"></div><div class="col-sm-3"><label class="form-label" for="from_date">Từ ngày UTC</label><input class="form-control" id="from_date" name="from_date" type="date"></div><div class="col-sm-3"><label class="form-label" for="to_date">Đến ngày UTC</label><input class="form-control" id="to_date" name="to_date" type="date"></div><div class="col-sm-1"><button class="btn btn-outline-primary" type="submit">Lọc</button></div></div></form><div id="listError" class="alert alert-danger d-none list-error" role="alert"></div><div class="list-status" id="listStatus" role="status"></div><div class="table-wrap"><table class="table"><thead><tr><th>Hóa đơn</th><th>Khách hàng</th><th>Người bán</th><th>Tổng tiền</th><th>Trạng thái đơn</th><th class="text-end">Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div>{% include 'components/pagination.html' %}</section>{% endblock %}
