name: ShopFlow regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: member_a_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/member_a_test_ci?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=docs/test-results/pytest-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: docs/test-results/pytest-ci.xml
